name: Flutter Android APK · Knowledge Compass
on:
  push:
    branches:
      - main
      - 'feature/knowledge-compass*'
  pull_request:
    branches:
      - 'feature/knowledge-compass-cloud'
      - 'feature/knowledge-compass-v086'
      - 'feature/knowledge-compass-v087'
  workflow_dispatch:
concurrency:
  group: knowledge-compass-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run security and contract tests
        run: python -m pytest -q backend/tests
  build-apk:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: |
          flutter create --project-name zhixing_compass --org com.zhixingcompass --platforms android .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          p.write_text(text)
          # read_pdf_text brings pdfbox-android, whose optional JPX/JPEG2000
          # decoder is not bundled. R8 must not treat that optional class
          # as a required app dependency. JPX image decoding is not supported.
          rules = Path('android/app/proguard-rules.pro')
          rules.write_text('-dontwarn com.gemalto.jp2.JP2Decoder\n')
          gradle = Path('android/app/build.gradle.kts')
          gradle_text = gradle.read_text()
          needle = 'buildTypes {\n        release {'
          if needle not in gradle_text:
              raise RuntimeError('Unexpected Flutter Android build.gradle.kts layout')
          gradle_text = gradle_text.replace(
              needle,
              'buildTypes {\n        release {\n'
              '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
              1)
          gradle.write_text(gradle_text)
          PY
      - name: Bundle licensed offline Chinese PDF font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          # Google Noto Sans SC (SIL Open Font License 1.1).
          # Verify the pinned original so a changed upstream file fails CI.
          url='https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
          expected='a3041811a78c361b1de50f953c805e0244951c21c5bd412f7232ef0d899af0da'
          font=urllib.request.urlopen(url,timeout=90).read()
          assert hashlib.sha256(font).hexdigest()==expected, 'Unexpected Chinese font checksum'
          assert len(font)<22000000, 'Font unexpectedly large'
          Path('assets/fonts/NotoSansSC.ttf').write_bytes(font)
          license_url='https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/OFL.txt'
          license_text=urllib.request.urlopen(license_url,timeout=30).read()
          assert b'SIL OPEN FONT LICENSE' in license_text
          Path('assets/fonts/OFL.txt').write_bytes(license_text)
          print(f'Bundled {len(font)} bytes of licensed Chinese font with OFL notice')
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Static analyzer
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test --concurrency=1 --reporter expanded --timeout 2m
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Verify APK signing certificate and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature-report.txt
          sha256sum "$APK" | tee apk-sha256.txt
          "$SDK_TOOLS/aapt" dump badging "$APK" | grep '^package:' | tee apk-version-report.txt
          grep -q "versionCode='27'" apk-version-report.txt
          grep -q "versionName='0.8.8'" apk-version-report.txt
          grep -q "com.zhixingcompass.zhixing_compass" apk-version-report.txt
          echo "Preview signing only; DO NOT claim cross-version overwrite compatibility."
      - name: Upload build provenance report
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeCompass-APK-Provenance
          path: |
            apk-signature-report.txt
            apk-sha256.txt
            apk-version-report.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload downloadable release APK
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeCompass-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
  publish-direct-apk:
    name: Publish direct APK download
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/feature/knowledge-compass-v088'
    permissions:
      contents: write
    steps:
      - name: Download already-tested APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KnowledgeCompass-Android-APK
          path: release-assets
      - name: Create or refresh GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/app-release.apk
          cp release-assets/app-release.apk release-assets/KnowledgeCompass-v0.8.8-preview.apk
          TAG=knowledge-compass-v0.8.8-preview
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/KnowledgeCompass-v0.8.8-preview.apk --clobber
          else
            gh release create "$TAG" release-assets/KnowledgeCompass-v0.8.8-preview.apk \
              --target "$GITHUB_SHA" \
              --title "知行罗盘 v0.8.8 Android 开发预览版" \
              --notes "Flutter Android 开发预览版。已完成 CI 编译；DeepSeek 在线联调和 Android 真机全功能验收尚未完成。不要在客户端保存 DeepSeek API Key。" \
              --prerelease
          fi
