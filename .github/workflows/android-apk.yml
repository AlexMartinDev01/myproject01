name: Build Starweave Tarot APK
on:
  push:
    branches:
      - feature/starweave-ai-tarot-v0.1
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "index.html"
      - "app.js"
      - "rules.js"
      - "style.css"
      - "service-worker.js"
      - "manifest.webmanifest"
      - "assets/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble bundled offline PWA assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/assets
          cp index.html app.js rules.js style.css manifest.webmanifest service-worker.js android/app/src/main/assets/
          cp -a assets/. android/app/src/main/assets/assets/
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo "Refusing to build with committed secrets" >&2
            exit 1
          fi
          test -f android/app/src/main/assets/assets/tarot_back.svg
          test -f android/app/src/main/assets/app.js
      - name: Compile installable debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Verify APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Starweave-Tarot-V0.1-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
