name: Dev Build ShiguangBox V2

on:
  push:
    branches:
      - feature-v2.0-pet-life-memory
    paths:
      - 'ShiguangBox/**'
      - '.github/workflows/build-shiguangbox-v2-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ShiguangBox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug
