name: Build and Release ShiguangBox

on:
  workflow_dispatch:
  push:
    branches:
      - shiguangbox-v1
      - feature-v2.1.0-3d-home-demo
    paths:
      - 'ShiguangBox/**'
      - '.github/workflows/build-shiguangbox.yml'

permissions:
  contents: write

concurrency:
  group: shiguangbox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.SHIGUANGBOX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: ShiguangBox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E "versionName '[^']+'" app/build.gradle | head -1 | cut -d"'" -f2)
          VERSION_CODE=$(grep -E 'versionCode [0-9]+' app/build.gradle | head -1 | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building ShiguangBox V$VERSION_NAME ($VERSION_CODE)"

      - name: Check release signing secrets
        shell: bash
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Restore release keystore
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shiguangbox-release.jks"
          test -s "$RUNNER_TEMP/shiguangbox-release.jks"

      - name: Verify release signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}
        run: |
          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/shiguangbox-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/shiguangbox-signing-check.csr"
          test -s "$RUNNER_TEMP/shiguangbox-signing-check.csr"

      - name: Build signed release APK
        env:
          SHIGUANGBOX_KEYSTORE_FILE: ${{ runner.temp }}/shiguangbox-release.jks
          SHIGUANGBOX_STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
          SHIGUANGBOX_KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
          SHIGUANGBOX_KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare release APK
        shell: bash
        run: |
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          if [[ "$VERSION_NAME" == "1.7.7" ]]; then
            OUTPUT_NAME="ShiguangBox_v1.7.7.apk"
          else
            OUTPUT_NAME="ShiguangBox_v${VERSION_NAME}_Release.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/$OUTPUT_NAME"
          echo "OUTPUT_NAME=$OUTPUT_NAME" >> "$GITHUB_ENV"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangBox-v${{ steps.app_version.outputs.version_name }}-Release-APK
          path: ShiguangBox/app/build/outputs/apk/release/${{ env.OUTPUT_NAME }}

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/shiguangbox-v1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        shell: bash
        run: |
          TAG="shiguangbox-v$VERSION_NAME"
          APK_PATH="app/build/outputs/apk/release/$OUTPUT_NAME"

          if [[ "$VERSION_NAME" == "2.1.0" ]]; then
            RELEASE_TITLE="拾光盒 V2.1.0 · 3D 小窝技术预览"
            cat > release-notes.md <<EOF
          拾光盒 V2.1.0 · 3D 小窝技术预览

          - versionCode: $VERSION_CODE
          - 新增原生 OpenGL ES 3D 小窝技术 Demo，不是 2D 缩放或伪 3D
          - 新增真实透视摄像机，可单指旋转视角、双指缩放、重置视角
          - 新增 3D 房间、地板、墙体、窗户、小床、地毯、小桌、收藏架、小球等空间物件
          - 新增橘团低多边形 3D 占位模型，包含头、身体、耳朵、四肢、尾巴、眼睛和口鼻区域
          - 橘团支持床边 / 窗边 / 地毯三个 3D 空间锚点
          - 新增自主巡游：到达目标后停留，再自动选择下一个位置
          - 移动过程包含朝向变化、身体上下起伏、四肢交替和尾巴摆动
          - 新增手动“去床边 / 去窗边 / 去地毯”测试按钮
          - 3D 页面与原有 2D 悬浮桌宠完全分离，不影响现有桌面陪伴性能
          - 当前版本重点验证 3D 技术路线与手机流畅度；正式三宠 3D 精模、骨骼动画与小世界系统将在确认方向后继续制作
          - 保留 V2.0.1 宠物世界、回忆盒、发现物、AI 对话、BehaviorSequence、Motion 2.0、雨团天气和彩虹系统

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "2.0.1" ]]; then
            RELEASE_TITLE="拾光盒 V2.0.1 · 宠物世界闭环修复"
            cat > release-notes.md <<EOF
          拾光盒 V2.0.1 · 宠物世界闭环修复

          - versionCode: $VERSION_CODE
          - 完成长效记忆闭环：完成待办、写记录、记录心情不再依赖悬浮桌宠是否开启
          - 悬浮提醒完成任务与 App 内完成任务使用同一时间戳记忆 ID，避免重复记忆
          - 普通 App 记录与桌宠快速记录均会进入真实本地记忆
          - 回忆容量从 40 条提升到 120 条
          - 回忆盒按当前宠物正确读取自己的最近记忆，不再被其他宠物最近记录挤掉
          - AI 宠物对话区分“共享用户事实”和“宠物专属记忆”：任务 / 心情 / 记录可共享，互动 / 发现物 / 专属聊天不串角色
          - 稀有发现只有用户真正“收进回忆盒”后才写入发现物回忆，修复“回忆有了但图鉴未发现”的不一致
          - 新增真实当日生活事件历史，回忆盒可看到当前宠物今天发生过多少个生活事件
          - 夜间安静事件现在同样遵守冷却和每日次数上限
          - 粘人度真正影响“多久没有互动后主动来找你”：安静更克制，超粘人更快出现
          - 今天已经记录过心情时，不再重复触发“今天感觉怎样”的主动邀请
          - 保留 V2.0.0 PetWorld、回忆盒、发现物、关系阶段、AI 宠物聊天、应用页面直达
          - 保留 V1.9.3 BehaviorSequence、V1.9.2 Motion 2.0、头顶气泡、雨团天气、彩虹、睡眠和在线更新

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "2.0.0" ]]; then
            RELEASE_TITLE="拾光盒 V2.0.0 · 宠物生活与回忆系统"
            cat > release-notes.md <<EOF
          拾光盒 V2.0.0 · 宠物生活与回忆系统

          - versionCode: $VERSION_CODE
          - 新增 PetWorld 生活调度层：时间、待办、心情、粘人度、关系阶段、每日历史、事件冷却共同决定宠物行为
          - 调度器支持自然留白：部分轮次什么都不发生，普通生活事件也可以只做动作不弹气泡
          - 新增发呆、观察、伸展、求关注、任务邀请、记录邀请、心情邀请、任务回味、情绪陪伴等生活事件
          - 三只宠物使用独立事件权重、文案和动作链，不再只是换皮
          - 新增回忆盒，本地保存重要互动、任务完成、心情、发现物和宠物聊天
          - 新增关系阶段：初识 / 熟悉 / 亲近 / 默契，不显示数值条
          - 新增 9 个发现物：橘团 / 芽芽 / 雨团各有偶遇、稀有、非常稀有收藏
          - 新增每日事件次数与冷却控制，避免同一事件反复出现
          - 稀有事件可开关，并提供测试入口；发现物只有收下后才进入回忆盒
          - 宠物气泡可直接打开真实待办页、快速记录页和心情页
          - 新增可选 AI 宠物自由聊天：复用现有 DeepSeek API Key，仅使用本机真实回忆作为历史依据
          - AI 宠物人格区分橘团 / 芽芽 / 雨团，并明确禁止编造不存在的用户经历
          - AI 对话成功后会在本机形成可继续引用的真实回忆
          - 新增“生活与回忆盒”界面，可查看关系阶段、发现物和最近共同回忆
          - 新增“测试一次生活事件”“测试一个稀有发现”入口
          - 保留 V1.9.3 BehaviorSequence 行为编排、V1.9.2 Motion 2.0 八个新动作
          - 保留气泡始终位于宠物头顶、粘人度、夜间安静、雨团天气、彩虹、睡眠和在线更新

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.9.3" ]]; then
            RELEASE_TITLE="拾光盒 V1.9.3 · 行为编排系统"
            cat > release-notes.md <<EOF
          拾光盒 V1.9.3 · 行为编排系统

          - versionCode: $VERSION_CODE
          - 新增独立 BehaviorSequence 行为编排层，将动作从“单个播放”升级为完整动作链
          - 每个动作会完整播放并自然回中，再进入下一动作，修复固定延时导致动作互相覆盖的问题
          - 行为链支持每步强度、速度、方向和动作间停顿
          - 橘团 / 芽芽 / 雨团拥有不同的专属行为组合与节奏
          - 想你、欢迎回来、任务回味、情绪陪伴、任务轻提醒等生活事件正式接入行为编排
          - 单击、双击、连续点击、长按摸摸分别接入不同的三宠动作链
          - “摸摸你 / 陪你一下”积极回应会进入二段行为链后再反馈
          - “我先忙”会播放克制收尾动作并进入安静期
          - 用户拖动、正式提醒、任务完成、心情反馈等高优先级交互会安全中断普通行为链
          - Motion 2.0 增加防重叠保护，当前动作未结束时不会被普通新动作强行覆盖
          - 新增“演示 V1.9.3 完整行为链”测试入口，可直接比较三只宠物的身体语言
          - 保留 V1.9.2 八个新动作、头顶气泡、粘人度、短期记忆、雨团天气、睡眠和彩虹系统

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.9.2" ]]; then
            RELEASE_TITLE="拾光盒 V1.9.2 · 动作引擎 2.0"
            cat > release-notes.md <<EOF
          拾光盒 V1.9.2 · 动作引擎 2.0

          - versionCode: $VERSION_CODE
          - 新增独立 PetMotion 动作层，保留原有稳定 State，不再把所有动作硬塞进状态机
          - 第一批新增 8 个独立动作：左右看看、歪头、抬头看、伸懒腰、小跳一下、困倦点头、害羞缩一下、主动求关注
          - 新动作直接作用于 28×28 网格，不是整张图片简单旋转或缩放
          - 橘团 / 芽芽 / 雨团拥有不同动作幅度、速度和身体语言参数
          - 待机随机动作池不再只有眨眼 / 挥爪 / 签名动作，并增加“什么都不做”的自然留白
          - 最近 3 个新动作会降低重复概率，减少机械循环
          - V1.9.1 连续行为链已经接入新动作，例如“想你了”会先观察 / 歪头 / 求关注，再弹气泡
          - 积极回应后会根据宠物类型使用不同二段动作
          - 新增“动作实验室 2.0”，可逐个选择 8 个动作并调节强度
          - 新增“连续演示 8 个新动作”，方便直接实机验收
          - 保留头顶气泡、主动陪伴、粘人度、短期记忆、雨团天气、睡眠和彩虹逻辑

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.9.1" ]]; then
            RELEASE_TITLE="拾光盒 V1.9.1 · 生活事件与连续行为链"
            cat > release-notes.md <<EOF
          拾光盒 V1.9.1 · 生活事件与连续行为链

          - versionCode: $VERSION_CODE
          - 新增连续行为链：宠物会先做动作，再等待，再弹气泡，而不是直接说一句话
          - 新增短期事件记忆，同一种主动事件不会在短时间内连续重复
          - 新增最近任务记忆，完成任务后一段时间可能触发“刚才那件事”的回味
          - “想你了 / 情绪陪伴 / 欢迎回来”等事件支持用户直接回应
          - 用户可选择“摸摸你 / 陪你一下”或“我先忙”
          - 选择积极回应后宠物会继续二段反应，并增加隐藏亲密度
          - 选择“我先忙”后宠物会进入安静期，不会很快再次主动打扰
          - 正式提醒、任务完成、心情记录、用户直接触摸时会自动打断普通生活事件链
          - 橘团 / 芽芽 / 雨团拥有不同动作顺序和反馈节奏
          - “测试主动陪伴”现在会演示完整连续行为链
          - 保留 V1.9.0 粘人度、夜间安静和主动陪伴系统
          - 保留 V1.8.3 气泡始终位于宠物头顶
          - 雨团天气、彩虹、睡眠和在线更新逻辑保持不变

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.9.0" ]]; then
            RELEASE_TITLE="拾光盒 V1.9.0 · 宠物生命系统 1.0"
            cat > release-notes.md <<EOF
          拾光盒 V1.9.0 · 宠物生命系统 1.0

          - versionCode: $VERSION_CODE
          - 新增主动陪伴系统，宠物不再只等待点击
          - 新增 4 档粘人度：安静 / 陪伴 / 粘人 / 超粘人
          - 新增主动陪伴总开关
          - 新增夜间安静模式：23:30–08:00 暂停主动气泡，仅保留轻动作
          - 主动行为会结合未互动时长、今天待办、完成数量、今日心情和隐藏亲密度
          - 橘团 / 芽芽 / 雨团拥有不同主动频率、动作选择和专属文案
          - 长时间未互动后会按宠物性格主动来找用户
          - 完成任务和心情互动会在后台积累隐藏亲密度，不显示游戏化数值
          - 服务重新出现且用户离开较久时支持“欢迎回来”反应
          - 新增“测试主动陪伴”入口，方便立即查看当前宠物表现
          - 保留 V1.8.3 气泡始终在宠物头顶、左右智能换边和动态跟随
          - 雨团睡眠天气、彩虹避让、在线更新和其他业务功能保持不变

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.8.3" ]]; then
            RELEASE_TITLE="拾光盒 V1.8.3 · 气泡固定头顶修复"
            cat > release-notes.md <<EOF
          拾光盒 V1.8.3 · 气泡固定头顶修复

          - versionCode: $VERSION_CODE
          - 气泡始终位于宠物头顶附近，不再允许出现在宠物下方
          - 只保留左上 / 右上两种智能布局
          - 宠物左右移动时，气泡会在头顶左右两侧自动切换
          - 气泡尾巴方向仍会自动朝向宠物
          - 彩虹场景继续自动避让，并保持头顶布局
          - 保留 V1.8.2 的动态跟随能力
          - 其他宠物动作、天气、在线更新和业务功能保持不变

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.8.2" ]]; then
            RELEASE_TITLE="拾光盒 V1.8.2 · 气泡动态跟随"
            cat > release-notes.md <<EOF
          拾光盒 V1.8.2 · 气泡动态跟随

          - versionCode: $VERSION_CODE
          - 上方气泡与宠物距离进一步缩短，整体更紧凑自然
          - 拖动宠物时气泡会同步跟随，不再直接消失
          - 自动贴边和探头动画期间，气泡持续跟随宠物位置
          - 宠物从左侧移动到右侧时，气泡位置与尾巴方向会自动重新计算
          - 彩虹出现、移动和消失时，气泡会动态重新避让
          - 增加轻微位置变化阈值，减少气泡抖动
          - 宠物动作、天气、在线更新和其他业务逻辑保持不变

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.8.1" ]]; then
            RELEASE_TITLE="拾光盒 V1.8.1 · 气泡智能布局修复"
            cat > release-notes.md <<EOF
          拾光盒 V1.8.1 · 气泡智能布局修复

          - versionCode: $VERSION_CODE
          - 气泡会根据宠物左右位置自动选择更自然的位置
          - 气泡尾巴会自动朝向宠物，不再固定方向
          - 彩虹出现时气泡自动避让彩虹区域
          - 彩虹场景启用更紧凑的装饰气泡尺寸
          - 气泡在宠物下方时，装饰背景尾巴会上翻指向宠物
          - 宠物、天气、在线更新和其他业务逻辑保持不变

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.8.0" ]]; then
            RELEASE_TITLE="拾光盒 V1.8.0 · 雨团睡眠天气联动"
            cat > release-notes.md <<EOF
          拾光盒 V1.8.0 · 雨团睡眠天气联动

          - versionCode: $VERSION_CODE
          - 雨团犯困时雨势会自然减弱
          - 雨团睡着后只保留极轻小雨或自然停雨
          - 睡眠期间禁止触发彩虹
          - 醒来后雨势分阶段恢复，再重新进入原有天气循环
          - 橘团、芽芽、在线更新系统及其他业务功能保持不变

          提交：$GITHUB_SHA
          EOF
          elif [[ "$VERSION_NAME" == "1.7.7" ]]; then
            RELEASE_TITLE="拾光盒 V1.7.7 · 在线更新链路测试"
            cat > release-notes.md <<EOF
          拾光盒 V1.7.7 · 在线更新链路测试

          - versionCode: $VERSION_CODE
          - 仅用于验证 V1.7.6 → V1.7.7 在线覆盖更新
          - 不修改宠物动作、雨团天气、彩虹、睡眠、界面和业务功能
          - 与 V1.7.6 使用完全相同的固定 Release 签名
          - 更新后应保留原有应用数据与设置

          提交：$GITHUB_SHA
          EOF
          else
            RELEASE_TITLE="拾光盒 V$VERSION_NAME"
            cat > release-notes.md <<EOF
          拾光盒 V$VERSION_NAME

          - versionCode: $VERSION_CODE
          - 固定 Release 签名构建

          提交：$GITHUB_SHA
          EOF
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            if [[ "$VERSION_NAME" == "1.7.7" ]]; then
              gh release edit "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" \
                --notes-file release-notes.md \
                --prerelease=false
            else
              gh release edit "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$RELEASE_TITLE" \
                --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          RELEASE_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.id')

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f make_latest=true \
            >/dev/null
