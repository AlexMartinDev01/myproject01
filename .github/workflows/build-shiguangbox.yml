name: Build V1.7.6 Update Bootstrap Hotfix

on:
  push:
    branches:
      - v1.7.6-update-bootstrap-hotfix
    paths:
      - 'ShiguangBox/**'
      - '.github/workflows/build-shiguangbox.yml'

permissions:
  contents: read

concurrency:
  group: shiguangbox-bootstrap-hotfix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.SHIGUANGBOX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: ShiguangBox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify V1.7.6 baseline
        shell: bash
        run: |
          grep -q "versionCode 40" app/build.gradle
          grep -q "versionName '1.7.6'" app/build.gradle

      - name: Restore release keystore
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shiguangbox-release.jks"
          test -s "$RUNNER_TEMP/shiguangbox-release.jks"

      - name: Build signed V1.7.6 bootstrap hotfix
        env:
          SHIGUANGBOX_KEYSTORE_FILE: ${{ runner.temp }}/shiguangbox-release.jks
          SHIGUANGBOX_STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
          SHIGUANGBOX_KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
          SHIGUANGBOX_KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/ShiguangBox_v1.7.6_UpdateBootstrapHotfix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangBox-v1.7.6-UpdateBootstrapHotfix
          path: ShiguangBox/app/build/outputs/apk/release/ShiguangBox_v1.7.6_UpdateBootstrapHotfix.apk
