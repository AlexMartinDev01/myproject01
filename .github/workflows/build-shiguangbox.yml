name: Build ShiguangBox APK

on:
  workflow_dispatch:
  push:
    branches:
      - shiguangbox-v1
    paths:
      - 'ShiguangBox/**'
      - '.github/workflows/build-shiguangbox.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShiguangBox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/拾光盒_v1.5.3_橘团芽芽切换最终修正版.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 拾光盒-v1.5.3-双宠切换最终修正-APK
          path: ShiguangBox/app/build/outputs/apk/debug/拾光盒_v1.5.3_橘团芽芽切换最终修正版.apk
