name: Build SodaLiveWidget APK

on:
  workflow_dispatch:
  push:
    branches:
      - soda-live-widget
    paths:
      - 'SodaLiveWidget/**'
      - '.github/workflows/build-soda-live-widget.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SodaLiveWidget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SodaLiveWidget-apk
          path: SodaLiveWidget/app/build/outputs/apk/debug/app-debug.apk
