name: Build RIFE Turn Test APK

on:
  push:
    branches:
      - experiment/turn-rife-apk
    paths:
      - 'ShiguangBox/**'
      - '.github/workflows/build-turn-rife-apk.yml'
      - 'experiments/turn_interp/results/rife4x_frames/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turn-rife-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.SHIGUANGBOX_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: ShiguangBox

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify RIFE frame inputs
        shell: bash
        working-directory: .
        run: |
          RIGHT_COUNT="$(find experiments/turn_interp/results/rife4x_frames -name 'frame_*.png' | wc -l)"
          LEFT_COUNT="$(find experiments/turn_interp/results/rife4x_left_frames -name 'frame_*.png' | wc -l)"
          test "$RIGHT_COUNT" -eq 17
          test "$LEFT_COUNT" -eq 17
          echo "Found 17 right + 17 left offline RIFE turn frames"

      - name: Restore release keystore
        shell: bash
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shiguangbox-release.jks"
          test -s "$RUNNER_TEMP/shiguangbox-release.jks"

      - name: Build signed experimental APK
        env:
          SHIGUANGBOX_KEYSTORE_FILE: ${{ runner.temp }}/shiguangbox-release.jks
          SHIGUANGBOX_STORE_PASSWORD: ${{ secrets.SHIGUANGBOX_STORE_PASSWORD }}
          SHIGUANGBOX_KEY_ALIAS: ${{ secrets.SHIGUANGBOX_KEY_ALIAS }}
          SHIGUANGBOX_KEY_PASSWORD: ${{ secrets.SHIGUANGBOX_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/ShiguangBox_v2.5.100_RIFE_Turn_Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangBox-v2.5.100-RIFE-Turn-Test
          path: ShiguangBox/app/build/outputs/apk/release/ShiguangBox_v2.5.100_RIFE_Turn_Test.apk

      - name: Publish updater-visible experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="shiguangbox-v2.5.100-rife-test"
          APK_PATH="app/build/outputs/apk/release/ShiguangBox_v2.5.100_RIFE_Turn_Test.apk"
          RELEASE_TITLE="拾光盒 V2.5.100 · RIFE 转身实验版"

          cat > "$RUNNER_TEMP/rife-test-release-notes.md" <<EOF
          拾光盒 V2.5.100 · RIFE 转身实验版

          - versionCode: 81
          - 这是专门验证橘团转身闪烁问题的在线实验版本
          - 使用当前 2.5.1 的 0° / 22.5° / 45° / 67.5° / 90° 五张真实关键姿态
          - Practical-RIFE 4.25 离线生成 4× 插值；右转 17 帧、左转 17 帧分别生成
          - 左右两套序列都从同一张未镜像正面 frame 0 出发，消除左转起步瞬间的正面翻转
          - Android 转身期间一次只显示一张离线插值帧，不再使用 SRC_OVER 双图 Crossfade
          - 90ms 眼神/头肩预判不再在 RIFE 开始时突然归零，而是带入前约 3 张 RIFE 帧逐渐衰减
          - 侧身步态新增独立 gaitStartNanos；90°后从 phase=0 起步，不再接入已经跑到半周期的腿部状态
          - 腿、身体起伏、尾巴、头眼微动在约 170ms 内从 0 平滑渐入
          - 第一脚迈出期间继续使用 RIFE 最后一张 90°纹理，不再切回旧侧身贴图
          - 橘团根位移从转身约 72% 后才开始，并用约 180ms 从零速度渐入，避免突然被横向拖走
          - 转身插值帧共享固定 Anchor / Scale / 脚底基线，减少位置抖动
          - 已知实验观察点：45°→67.5° 的少量 RIFE 中间帧仍可能有耳朵/脸部局部插值伪影
          - 本版本仅用于实机验证，不代表最终正式方案

          提交：$GITHUB_SHA
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/rife-test-release-notes.md" \
              --prerelease=false
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/rife-test-release-notes.md"
          fi

          RELEASE_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.id')

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f make_latest=true \
            >/dev/null

          echo "Published $TAG as latest release for in-app updater"
