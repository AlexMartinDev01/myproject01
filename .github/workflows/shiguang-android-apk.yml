name: Build ShiguangBox APK

on:
  push:
    branches:
      - shiguang-android-apk
    paths:
      - 'shiguang-android/**'
      - '.github/workflows/shiguang-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        working-directory: shiguang-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp shiguang-android/app/build/outputs/apk/debug/app-debug.apk shiguang-android/ShiguangBox-v1.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangBox-v1.2.0-APK
          path: shiguang-android/ShiguangBox-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30
