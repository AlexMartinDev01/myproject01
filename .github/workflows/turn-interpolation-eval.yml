name: Turn interpolation experiment

on:
  push:
    branches:
      - experiment/turn-interpolation-eval
    paths:
      - 'experiments/turn_interp/evaluate.py'
      - 'experiments/turn_interp/common.py'
      - '.github/workflows/turn-interpolation-eval.yml'
      - 'ShiguangBox/app/src/main/pet_assets/orange_turn_22_5/**'
      - 'ShiguangBox/app/src/main/pet_assets/orange_turn_67_5/**'
      - 'ShiguangBox/app/src/main/res/drawable-nodpi/pet_orange_idle.webp'
      - 'ShiguangBox/app/src/main/res/drawable-nodpi/pet_orange_3q_right.webp'
      - 'ShiguangBox/app/src/main/res/drawable-nodpi/pet_orange_side_right.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/turn-interpolation-eval
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy==1.26.4' 'pillow==10.4.0' 'opencv-python-headless==4.10.0.84'
          pip install 'torch==2.2.2' --index-url https://download.pytorch.org/whl/cpu

      - name: Prepare Practical-RIFE 4.25
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/hzwer/Practical-RIFE.git /tmp/Practical-RIFE
          cd /tmp/Practical-RIFE
          git checkout 17d8c7a1005b37f4c97bfee04e316aaec7fdc536 || true
          rm -rf train_log
          mkdir -p train_log
          curl -L --fail --retry 3 \
            https://huggingface.co/Bash2X/RIFE-Models/resolve/main/RIFE_v4.25.zip \
            -o /tmp/RIFE_v4.25.zip
          rm -rf /tmp/rife_unpack
          mkdir -p /tmp/rife_unpack
          unzip -q /tmp/RIFE_v4.25.zip -d /tmp/rife_unpack
          WEIGHT="$(find /tmp/rife_unpack -type f -name flownet.pkl | head -1)"
          test -n "$WEIGHT"
          MODEL_DIR="$(dirname "$WEIGHT")"
          cp -a "$MODEL_DIR"/. /tmp/Practical-RIFE/train_log/
          for f in RIFE_HDv3.py IFNet_HDv3.py refine.py; do
            if [ ! -f "/tmp/Practical-RIFE/train_log/$f" ]; then
              curl -L --fail --retry 3 \
                "https://huggingface.co/Isi99999/Frame_Interpolation_Models/resolve/main/4.25/train_log/$f" \
                -o "/tmp/Practical-RIFE/train_log/$f"
            fi
          done
          ls -lh /tmp/Practical-RIFE/train_log

      - name: Run controlled experiment
        env:
          RIFE_HOME: /tmp/Practical-RIFE
        run: |
          python experiments/turn_interp/evaluate.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: turn-interpolation-experiment
          path: experiments/turn_interp/results

      - name: Commit reproducible results to experiment branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/turn_interp/results
          git commit -m "experiment: record turn interpolation results" || exit 0
          git push origin HEAD:experiment/turn-interpolation-eval
