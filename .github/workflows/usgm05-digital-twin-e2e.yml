name: USGM-05 Browser Digital Twin E2E
on:
  push:
    paths:
      - 'usgm-05/browser-digital-twin/**'
      - '.github/workflows/usgm05-digital-twin-e2e.yml'
  pull_request:
    paths:
      - 'usgm-05/browser-digital-twin/**'
      - '.github/workflows/usgm05-digital-twin-e2e.yml'
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Full C-WASM + original phone UI + 3D integration
        run: python usgm-05/browser-digital-twin/tests/e2e_browser.py
      - name: Mobile portrait responsive test
        run: python usgm-05/browser-digital-twin/tests/responsive_browser.py
      - name: Collect verified screenshots and data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usgm05-browser-twin-e2e-evidence
          path: |
            usgm-05/browser-digital-twin/docs/*.png
            usgm-05/browser-digital-twin/docs/browser_e2e_results.json
            usgm-05/browser-digital-twin/docs/exported_simulation.csv
          if-no-files-found: warn
