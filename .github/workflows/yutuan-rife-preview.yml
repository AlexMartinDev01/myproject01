name: Yutuan RIFE 4x preview

on:
  push:
    branches:
      - experiment/yutuan-rife-preview
    paths:
      - 'experiments/yutuan_rife_preview/**'
      - '.github/workflows/yutuan-rife-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yutuan-rife-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/yutuan-rife-preview

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy==1.26.4' 'pillow==10.4.0' 'opencv-python-headless==4.10.0.84'
          pip install 'torch==2.2.2' 'torchvision==0.17.2' --index-url https://download.pytorch.org/whl/cpu
          ffmpeg -version | head -1

      - name: Prepare Practical-RIFE 4.25
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/hzwer/Practical-RIFE.git /tmp/Practical-RIFE
          cd /tmp/Practical-RIFE
          git checkout 17d8c7a1005b37f4c97bfee04e316aaec7fdc536 || true

          rm -rf train_log
          mkdir -p train_log

          curl -L --fail --retry 3             https://huggingface.co/Bash2X/RIFE-Models/resolve/main/RIFE_v4.25.zip             -o /tmp/RIFE_v4.25.zip

          rm -rf /tmp/rife_unpack
          mkdir -p /tmp/rife_unpack
          unzip -q /tmp/RIFE_v4.25.zip -d /tmp/rife_unpack

          WEIGHT="$(find /tmp/rife_unpack -type f -name flownet.pkl | head -1)"
          test -n "$WEIGHT"
          MODEL_DIR="$(dirname "$WEIGHT")"
          cp -a "$MODEL_DIR"/. /tmp/Practical-RIFE/train_log/

          for f in RIFE_HDv3.py IFNet_HDv3.py refine.py; do
            if [ ! -f "/tmp/Practical-RIFE/train_log/$f" ]; then
              curl -L --fail --retry 3                 "https://huggingface.co/Isi99999/Frame_Interpolation_Models/resolve/main/4.25/train_log/$f"                 -o "/tmp/Practical-RIFE/train_log/$f"
            fi
          done

          ls -lh /tmp/Practical-RIFE/train_log

      - name: Run Rain turn 17 to 65 frame experiment
        env:
          RIFE_HOME: /tmp/Practical-RIFE
        run: |
          python experiments/yutuan_rife_preview/run_rife.py

      - name: Verify outputs
        shell: bash
        run: |
          test "$(find experiments/yutuan_rife_preview/results/rife4x_frames -name 'frame_*.png' | wc -l)" -eq 65
          test -s experiments/yutuan_rife_preview/results/yutuan_RIFE4x_48fps.mp4
          test -s experiments/yutuan_rife_preview/results/original17_vs_RIFE65_48fps.mp4
          test -s experiments/yutuan_rife_preview/results/yutuan_RIFE4x_48fps.gif
          echo "Rain RIFE preview outputs verified"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: yutuan-rife4x-preview
          path: |
            experiments/yutuan_rife_preview/results/REPORT.md
            experiments/yutuan_rife_preview/results/metrics.json
            experiments/yutuan_rife_preview/results/yutuan_RIFE4x_48fps.gif
            experiments/yutuan_rife_preview/results/yutuan_RIFE4x_60fps.gif
            experiments/yutuan_rife_preview/results/yutuan_RIFE4x_48fps.mp4
            experiments/yutuan_rife_preview/results/yutuan_RIFE4x_60fps.mp4
            experiments/yutuan_rife_preview/results/original17_vs_RIFE65_48fps.gif
            experiments/yutuan_rife_preview/results/original17_vs_RIFE65_48fps.mp4
            experiments/yutuan_rife_preview/results/rife_key_positions_contact_sheet.png
            experiments/yutuan_rife_preview/results/rife4x_frames/
