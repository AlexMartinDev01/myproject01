plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.shiguangbox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shiguangbox.app'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.0.0'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def petAssetPartsDir = file("$projectDir/src/main/pet_assets/orange_idle")
def petAssetOutput = file("$projectDir/src/main/res/drawable-nodpi/pet_orange_idle.webp")

def decodePetAssets = tasks.register("decodePetAssets") {
    inputs.dir(petAssetPartsDir)
    outputs.file(petAssetOutput)

    doLast {
        def parts = petAssetPartsDir.listFiles()
            ?.findAll { it.name.endsWith(".txt") }
            ?.sort { a, b -> a.name <=> b.name }

        if (parts == null || parts.isEmpty()) {
            throw new GradleException("No orange pet asset chunks found")
        }

        def encoded = parts.collect {
            it.getText("UTF-8").replaceAll("\\s", "")
        }.join("")

        petAssetOutput.parentFile.mkdirs()
        petAssetOutput.bytes = java.util.Base64.decoder.decode(encoded)
        println("Decoded HD pet asset: " + petAssetOutput + " (" + petAssetOutput.length() + " bytes)")
    }
}

tasks.named("preBuild").configure {
    dependsOn(decodePetAssets)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
