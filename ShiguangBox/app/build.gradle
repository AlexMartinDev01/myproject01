plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

def releaseKeystorePath =
    System.getenv("SHIGUANGBOX_KEYSTORE_FILE")
def releaseStorePassword =
    System.getenv("SHIGUANGBOX_STORE_PASSWORD")
def releaseKeyAlias =
    System.getenv("SHIGUANGBOX_KEY_ALIAS")
def releaseKeyPassword =
    System.getenv("SHIGUANGBOX_KEY_PASSWORD")

def releaseSigningReady =
    [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
    ].every {
        it != null &&
            !it.trim().isEmpty()
    }

android {
    namespace 'com.shiguangbox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shiguangbox.app'
        minSdk 26
        targetSdk 35
        versionCode 80
        versionName '2.5.99-rife-test'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def petAssetPartsDir = file("$projectDir/src/main/pet_assets/orange_idle")
def petAssetOutput = file("$projectDir/src/main/res/drawable-nodpi/pet_orange_idle.webp")

def decodePetAssets = tasks.register("decodePetAssets") {
    inputs.dir(petAssetPartsDir)
    outputs.file(petAssetOutput)

    doLast {
        def parts = petAssetPartsDir.listFiles()
            ?.findAll { it.name.endsWith(".txt") }
            ?.sort { a, b -> a.name <=> b.name }

        if (parts == null || parts.isEmpty()) {
            throw new GradleException("No orange pet asset chunks found")
        }

        def encoded = parts.collect {
            it.getText("UTF-8").replaceAll("\\s", "")
        }.join("")

        petAssetOutput.parentFile.mkdirs()
        petAssetOutput.bytes = java.util.Base64.decoder.decode(encoded)
        println("Decoded HD pet asset: " + petAssetOutput + " (" + petAssetOutput.length() + " bytes)")
    }
}

