plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.starweave.tarot'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.starweave.tarot'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
