<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>星语 Tarot · 动效工作台</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0d1e;font-family:Georgia,serif;color:#dfc58e}.stage{position:relative;width:540px;height:720px;overflow:hidden;background:radial-gradient(circle at 50% 44%,#312343,#111426 50%,#080d1a 95%);perspective:1000px}.stage:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#f6d99c 0.6px,transparent 1px);background-size:70px 92px;opacity:.22}.outer{position:absolute;left:50%;top:45%;width:370px;height:370px;transform:translate(-50%,-50%);border:1px solid #d2b47660;border-radius:50%;box-shadow:0 0 0 25px #d5ae7510,0 0 75px #9670a331,inset 0 0 44px #cb9d5930}.outer:before{content:'';position:absolute;inset:26px;border:1px dashed #c7ac745e;border-radius:50%}.outer:after{content:'';position:absolute;inset:88px;border:1px solid #d9c18550;border-radius:50%}.celestial{position:absolute;left:50%;top:44%;width:420px;height:420px;transform:translate(-50%,-50%);color:#cba876af}.celestial span{position:absolute;font-size:27px}.celestial span:nth-child(1){left:48%;top:1%}.celestial span:nth-child(2){right:2%;top:45%}.celestial span:nth-child(3){left:48%;bottom:1%}.celestial span:nth-child(4){left:2%;top:45%}.gold-halo{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,#dab4782c,transparent 60%);filter:blur(16px)}.card{position:absolute;left:50%;top:42%;width:145px;height:242px;margin-left:-72.5px;margin-top:-121px;transform-origin:50% 70%;transform-style:preserve-3d;will-change:transform}.card .flip{width:100%;height:100%;transform-style:preserve-3d}.card .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;filter:drop-shadow(0 8px 11px #0009);background-size:100% 100%;box-shadow:0 0 0 1px #e8c68889}.card .back{background-image:url('./assets/tarot_back.svg')}.card .front{background-image:url('./assets/M17.svg');transform:rotateY(180deg)}.starburst{position:absolute;left:50%;top:43%;width:220px;height:220px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#e8c6847a 0,transparent 40%);filter:blur(20px);opacity:0}.heading{position:absolute;left:0;right:0;top:55px;text-align:center;font-size:15px;letter-spacing:5px;color:#ebd7ad}.sub{position:absolute;left:0;right:0;top:94px;text-align:center;font-family:'Noto Serif CJK SC',serif;font-size:25px;letter-spacing:4px;color:#fff3dc}.foot{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-size:13px;letter-spacing:3px;color:#c6b1c7}.foot:before,.foot:after{content:'✦';color:#d5b57f;margin:0 17px}
</style></head><body><div class="stage" id="stage"><div class="gold-halo"></div><div class="outer"></div><div class="celestial"><span>✦</span><span>☾</span><span>✧</span><span>☽</span></div><div class="heading" id="eng">THE SHUFFLE RITUAL</div><div class="sub" id="title">星辰洗牌</div><div id="cards"></div><div class="starburst" id="burst"></div><div class="foot" id="foot">FOLLOW YOUR INTUITION</div></div><script>
const cardWrap=document.getElementById('cards');
const cards=Array.from({length:12},(_,i)=>{const e=document.createElement('div');e.className='card';e.style.zIndex=i;e.innerHTML='<div class="flip"><div class="face back"></div><div class="face front"></div></div>';cardWrap.append(e);return e;});
const clamp=x=>Math.max(0,Math.min(1,x));const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
window.setMotionFrame=(type,p)=>{
 const names={shuffle:['THE SHUFFLE RITUAL','星辰洗牌','BREATHE · RELEASE · BEGIN'],cut:['CUT THE DECK','静心切牌','LISTEN TO YOUR INTUITION'],draw:['CHOOSE A CARD','心动抽牌','YOUR CHOICE · YOUR STORY'],flip:['THE REVEAL','命运揭牌','A NEW PERSPECTIVE']};
 const [en,zh,ft]=names[type];document.getElementById('eng').textContent=en;document.getElementById('title').textContent=zh;document.getElementById('foot').textContent=ft;
 const a=Math.sin(Math.PI*p)**2;
 const stageBurst=document.getElementById('burst');stageBurst.style.opacity=(type==='flip'||type==='draw')? a*.6:0;
 cards.forEach((el,i)=>{
  el.style.display=type==='flip'&&i!==11?'none':'block';
  let x=0,y=(i-6)*1.3,rot=0,z=0,scale=1,ry=0;
  if(type==='shuffle'){
   const s=(i%2?1:-1),row=Math.floor(i/2);
   const offset=Math.sin((i+1)*.95+p*Math.PI*2)*8;
   x=s*(45+row*7)*a+offset*a; y=(row-4)*11*a+Math.sin(i*1.2+p*6)*6*a;
   rot=s*(5+row*3)*a;scale=1+(.015*i)*a;
  }else if(type==='cut'){
   const part=i<6?-1:1;
   x=part*110*a;
   y=part*(18+9*Math.sin(p*Math.PI*2))*a;
   rot=part*7*a;
  }else if(type==='draw'){
   const j=i-5.5;const spread=smooth(Math.min(1,p*3))*smooth(Math.min(1,(1-p)*3));
   x=j*30*spread;
   y=(Math.abs(j))*9*spread+(i-6)*.4;
   rot=j*4.2*spread;
   if(i===6){const lift=smooth((p-.35)/.23)*(1-smooth((p-.73)/.22));y-=110*lift;scale=1+.26*lift;z=120*lift;}
  }else if(type==='flip'){
   const u=p<.5?smooth(p*2):1-smooth((p-.5)*2);
   z=55*Math.sin(Math.PI*u);y=-14*Math.sin(Math.PI*u);scale=1+.1*Math.sin(Math.PI*u);ry=180*u;
  }
  el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotate(${rot}deg) scale(${scale})`;
  el.querySelector('.flip').style.transform=`rotateY(${ry}deg)`;
 });
};window.setMotionFrame('shuffle',0);
</script></body></html>
