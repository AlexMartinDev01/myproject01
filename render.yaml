# Knowledge Compass personal cloud AI gateway (non-production pilot).
# No keys are stored in the repository or baked into the APK.
services:
  - type: web
    name: zhixing-compass-ai-personal
    runtime: python
    plan: free
    region: singapore
    branch: feature/knowledge-compass-cloud
    autoDeployTrigger: off
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /livez
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: APP_DEVICE_TOKEN
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: CLOUD_GATEWAY_MODE
        value: "1"
